[project]
name = "novel-agent-framework"
version = "0.1.0"
description = "Codex-first deterministic multi-agent runtime for Korean long-form fiction"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.scripts]
novel-framework = "novel_agent_framework.cli:main"

[project.optional-dependencies]
dev = ["ruff>=0.8", "mypy>=1.13"]
local-embeddings = ["sentence-transformers>=3.0"]
openai-embeddings = ["openai>=1.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
